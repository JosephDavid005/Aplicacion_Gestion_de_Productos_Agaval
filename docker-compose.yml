services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /app/backend
    command: ["sh", "-c", "dotnet watch run --project src/GestorInventario.Api --urls http://0.0.0.0:8080 --non-interactive"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver;Database=GestorInventarioDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - ./backend:/app/backend
    depends_on:
      sqlserver:
        condition: service_healthy
    profiles: ["app"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app/frontend
    command: ["bun", "run", "server.ts"]
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      api:
        condition: service_started
    profiles: ["app"]

  api-tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /app/backend
    command: ["dotnet", "test", "--verbosity", "quiet", "--nologo"]
    volumes:
      - ./backend:/app/backend
    profiles: ["test"]

  frontend-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app/frontend
    command: ["bun", "run", "test", "--", "--watch=false"]
    volumes:
      - ./frontend:/app/frontend
    profiles: ["test"]

volumes:
  sqlserver-data:
